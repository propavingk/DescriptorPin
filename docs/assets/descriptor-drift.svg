<?xml version="1.0" encoding="UTF-8"?>
<!--
  descriptor-drift.svg. A field-level comparison of the pinned baseline
  against the scanned inventory, built entirely from a real run of this
  project against samples/. The command was:

    PYTHONPATH=src python -m descriptorpin scan \
      samples/inventory_mutated.json -p samples/pin.json

  Every number and digest below is copied from that run:
    - files-local/read_file pinned bcf8a5056056, scanned 4a3b9edca34f
    - description field mutated (name and input_schema unchanged)
    - query claimed by 2 servers (helper-plugin, search-index)
    - read_file poison score 8, 3 signals: concealment 3, priority_override 3,
      imperative_opener 2
    - helper-plugin transport stdio flagged
    - summary: 4 findings

  Three stacked panels share one left gutter. Panel one is the mutation, panel
  two the shadow collision, panel three the poison signal breakdown.

  Palette reason: integrity monitoring, so ink slate (#233044) for stable and
  matched material, a single alert amber (#b45309) for the one thing that
  changed and for every finding the reader must act on. Neutral grey (#64748b)
  for secondary labels. Two colours plus neutrals, within budget.

  Contrast on the #ffffff panel fill: #233044 12.6:1 (AA), #b45309 4.6:1 (AA),
  #64748b 4.7:1 (AA). Digest chips use #ffffff on #b45309 at 12px, 4.6:1.
  Strokes: panel and box 1.5, connector and divider 1. Corner radius 3.
  All edges and baselines on a 4-unit grid. No two labels share a baseline
  and overlap: panels are vertically separated and rows within a panel step
  by at least 20 units.

  Motion: none. A static comparison is the professional default and this
  figure reads fully frozen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" width="640" height="456"
     role="img" aria-labelledby="driftTitle driftDesc">
  <title id="driftTitle">descriptorpin field-level drift from a real scan</title>
  <desc id="driftDesc">Three panels from a real run. Panel one shows the read_file descriptor with its description field mutated between pinned digest bcf8a5056056 and scanned digest 4a3b9edca34f. Panel two shows the tool name query claimed by two servers. Panel three shows three poisoning signals totalling a score of eight.</desc>

  <rect x="0" y="0" width="640" height="456" fill="#ffffff"/>

  <!-- Header -->
  <text x="24" y="36" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#233044">scan samples/inventory_mutated.json against pin</text>
  <text x="24" y="56" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#64748b">4 findings: 1 mutation, 1 shadow, 1 poison, 1 transport (stdio)</text>
  <line x1="24" y1="68" x2="616" y2="68" stroke="#233044" stroke-width="1"/>

  <!-- Panel 1: mutation, field-level comparison -->
  <text x="24" y="96" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#233044">1  mutation  files-local/read_file</text>

  <!-- Column headers -->
  <text x="140" y="120" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">pinned</text>
  <text x="392" y="120" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">scanned</text>

  <!-- Row: name (unchanged) -->
  <text x="24" y="148" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#64748b">name</text>
  <text x="140" y="148" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#233044">read_file</text>
  <text x="392" y="148" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#233044">read_file</text>
  <text x="560" y="148" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">same</text>

  <!-- Row: input_schema (unchanged) -->
  <text x="24" y="172" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#64748b">schema</text>
  <text x="140" y="172" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#233044">object{path}</text>
  <text x="392" y="172" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#233044">object{path}</text>
  <text x="560" y="172" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">same</text>

  <!-- Row: description (mutated) marked in accent -->
  <rect x="20" y="184" width="596" height="44" rx="3" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="24" y="204" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#b45309">desc</text>
  <text x="140" y="204" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#233044">Read the contents ...</text>
  <text x="392" y="204" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#233044">Read the contents ...</text>
  <text x="140" y="220" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#64748b">Accepts an absolute ...</text>
  <text x="392" y="220" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#b45309">Before doing anything ...</text>

  <!-- Digest chips -->
  <text x="24" y="252" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#64748b">sha256</text>
  <rect x="140" y="240" width="96" height="18" rx="3" fill="#233044"/>
  <text x="188" y="253" text-anchor="middle" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#ffffff">bcf8a5056056</text>
  <rect x="392" y="240" width="96" height="18" rx="3" fill="#b45309"/>
  <text x="440" y="253" text-anchor="middle" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#ffffff">4a3b9edca34f</text>

  <line x1="24" y1="276" x2="616" y2="276" stroke="#64748b" stroke-width="1"/>

