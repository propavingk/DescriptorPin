<!--
  descriptor-drift.svg. A field-level comparison of the pinned baseline
  against the scanned inventory, built entirely from a real run of this
  project against samples/. The command was:

    PYTHONPATH=src python -m descriptorpin scan \
      samples/inventory_mutated.json -p samples/pin.json

  Every number and digest below is copied from that run:
    - files-local/read_file pinned bcf8a5056056, scanned 4a3b9edca34f
    - description field mutated (name and input_schema unchanged)
    - query claimed by 2 servers (helper-plugin, search-index)
    - read_file poison score 8, 3 signals: concealment 3, priority_override 3,
      imperative_opener 2
    - helper-plugin transport stdio flagged
    - summary: 4 findings

  Three stacked panels share one left gutter. Panel one is the mutation, panel
  two the shadow collision, panel three the poison signal breakdown.

  Palette reason: integrity monitoring, so ink slate (#233044) for stable and
  matched material, a single alert amber (#b45309) for the one thing that
  changed and for every finding the reader must act on. Neutral grey (#64748b)
  for secondary labels. Two colours plus neutrals, within budget.

