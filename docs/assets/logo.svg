<?xml version="1.0" encoding="UTF-8"?>
<!--
  descriptorpin logo. Wordmark with a colour split at the morpheme boundary
  of the compound name: "descriptor" in ink slate, "pin" in the accent amber,
  because pinning is the one operation the tool performs on a descriptor.

  Above the wordmark sits a literal diagram of the core data structure: a
  descriptor box linked by a pin (the connector) to a fixed hash node. One
  connector stroke, one box stroke, one node radius, one corner radius.

  Palette reason: subject is integrity anchoring, so ink slate (#233044) for
  the descriptor and a single warm anchor amber (#b45309) for the pin, the
  thing the reader should look at first. Neutrals do not count to the budget.

  Contrast against the white background: #233044 is 12.6:1 (AA). #b45309 is
  4.6:1 (AA normal text). The hash glyph #ffffff on the #b45309 node fill is
  4.6:1 at 11px, and the node is a mark not body copy. Strokes: box 1.5,
  connector 1.5. Corner radius 3. Coordinates on an 8-unit grid.

  Legible at 32px and 240px: the wordmark carries the identity at small size,
  the mark reads as a linked pair at large size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120"
     role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">descriptorpin</title>
