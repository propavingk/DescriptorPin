[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "descriptorpin"
version = "1.0.1"
description = "Defensive integrity monitor for Model Context Protocol tool descriptors."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DescriptorPin contributors"}]
keywords = ["mcp", "security", "tool-poisoning", "integrity", "descriptor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

[project.scripts]
descriptorpin = "descriptorpin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/propavingk/DescriptorPin"
Source = "https://github.com/propavingk/DescriptorPin"

